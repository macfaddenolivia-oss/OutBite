    @media (prefers-color-scheme: dark) { .ring { stroke: #F0AF74; } }
  </style>
  <defs>
    <mask id="ob-bite-s" maskUnits="userSpaceOnUse" x="-50" y="-50" width="2000" height="2000">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="49" cy="11" r="7.5" fill="#000"/>
      <circle cx="56" cy="20" r="7" fill="#000"/>
      <circle cx="42" cy="6" r="6" fill="#000"/>
    </mask>
  </defs>
  <circle class="ring" cx="32" cy="32" r="21" fill="none" stroke-width="12" mask="url(#ob-bite-s)"/>
